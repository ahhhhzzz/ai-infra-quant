<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title><style>
body{font:15px/1.55 system-ui,sans-serif;background:#101a2b;color:#e4ebf5;margin:0}
main{max-width:1440px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 8px}
p{margin:8px 0}.muted{color:#b1bed4}.notice{border-left:4px solid #edbf62;padding:12px;background:#283049}
.card{background:#19253a;padding:16px;border-radius:10px;margin:16px 0}
button,select,input{background:#283a55;color:#fff;border:1px solid #6982a3;padding:7px;border-radius:5px}
a{color:#83c8ff}canvas{width:100%;height:360px;display:block}
.scroll{overflow:auto;max-height:540px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;border-bottom:1px solid #34445e;padding:9px;vertical-align:top}
th{position:sticky;top:0;background:#22334e}tr:hover{background:#2a3d5b;cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}code{overflow-wrap:anywhere}
.selected{background:#344967}#detail{max-height:420px;overflow:auto}
@media(max-width:600px){main{padding:12px}canvas{height:280px}}
</style><main><h1>__TITLE__</h1>
<p class="muted">完成 K 线 → 参考结构 → 价格事件；点击事件行定位 K 线和冻结证据。</p>
<div class="notice" id="notice"></div><section class="card"><p id="overview"></p>
<p id="readiness"></p><details><summary>输入、版本、参数身份及限制</summary><pre id="metadata"></pre></details>
<p><a href="input.json">输入 JSON</a> · <a href="structure.json">结构 JSON</a> ·
<a href="events.json">精确事件 JSON</a> · <a href="summary.json">摘要 JSON</a></p></section>
<section class="card"><div><button id="prev">← 50 bars</button> <button id="next">50 bars →</button>
<span id="window"></span></div><canvas id="chart"></canvas><p id="candle" class="muted"></p></section>
<section class="card"><label>事件类别 <select id="kind"><option value="">全部</option></select></label>
<label> 状态 <select id="status"><option value="">全部</option></select></label>
<span id="count"></span><div class="scroll"><table><thead><tr><th>完成时间 / bar</th><th>类别 / 方向</th>
<th>状态</th><th>来源 / 冻结区间</th><th>原因 / 关联</th></tr></thead><tbody id="rows"></tbody></table></div>
<p>数字字符串为精确导出值。图形坐标使用浏览器数值，仅供显示，不参与计算。</p></section>
<section class="card"><h2>选中事件的完整证据</h2><pre id="detail">选择事件行。</pre></section>
<p class="muted">没有 Setup/Risk、LONG_READY、交易建议或收益结果。历史起点敏感性仍存在。</p></main>
<script id="payload" type="application/json">__PAYLOAD__</script><script>
'use strict';
const p=JSON.parse(document.getElementById('payload').textContent), s=p.summary, bars=p.bars;
const records=p.events.records.map(r=>({...r.record.evidence, effective_at:r.record.effective_at,
 record_id:r.record_id})).sort((a,b)=>a.bar_index-b.bar_index||a.kind.localeCompare(b.kind)||
 a.event_key.localeCompare(b.event_key)||a.status.localeCompare(b.status));
const $=id=>document.getElementById(id);
$('notice').textContent=s.mode==='AS_OF'?'AS_OF：严格输入模式 / '+s.context_status+'；合成样例不代表真实市场验证。':
 'OBSERVATIONAL / strict_confirmation=false：历史时点未认证，保留复权、版本及日历限制。';
$('overview').textContent=`${s.security} / ${s.timeframe} · ${s.bars} bars · ${s.first_completed_at} → `+
 `${s.last_completed_at} · Context ${s.context_status} / Event ${s.event_status}`;
$('readiness').textContent='组件准备度：'+JSON.stringify(s.event_summary?.readiness??{})+
 ' · 当前状态：'+(s.event_summary?.regime??'未可用');
$('metadata').textContent=JSON.stringify(s,null,2);
for(const field of ['kind','status']) for(const v of [...new Set(records.map(r=>r[field]))].sort()){
 const o=document.createElement('option');o.value=o.textContent=v;$(field).append(o);}
let left=0, selected=null;
function draw(){const c=$('chart'),dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();
 c.width=rect.width*dpr;c.height=rect.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
 const w=rect.width,h=rect.height, right=Math.min(bars.length,left+80),view=bars.slice(left,right);
 x.clearRect(0,0,w,h);if(!view.length)return;
 let lo=Math.min(...view.map(b=>Number(b.low))), hi=Math.max(...view.map(b=>Number(b.high)));
 const pad=Math.max((hi-lo)*.1,.01);lo-=pad;hi+=pad;
 const y=v=>h-30-(Number(v)-lo)/(hi-lo)*(h-60),step=(w-85)/view.length,px=i=>65+(i-left+.5)*step;
 x.font='11px system-ui';x.fillStyle='#b1bed4';
 for(let n=0;n<=4;n++){let v=lo+(hi-lo)*n/4;x.fillText(v.toFixed(2),2,y(v));}
 view.forEach((b,j)=>{let i=left+j,cx=px(i);x.strokeStyle=x.fillStyle=Number(b.close)>=Number(b.open)?
 '#49d4b0':'#fb8a8a';x.beginPath();x.moveTo(cx,y(b.high));x.lineTo(cx,y(b.low));x.stroke();
 x.fillRect(cx-step*.32,Math.min(y(b.open),y(b.close)),Math.max(1,step*.64),
 Math.max(1,Math.abs(y(b.open)-y(b.close))));});
 const locations=new Set(records.map(r=>r.bar_index));x.fillStyle='#f4ca74';
 for(const i of locations)if(i>=left&&i<right){x.beginPath();x.arc(px(i),h-13,3,0,7);x.fill();}
 if(selected!==null&&selected>=left&&selected<right){x.strokeStyle='#ffffff';x.beginPath();
 x.moveTo(px(selected),10);x.lineTo(px(selected),h-25);x.stroke();}
 $('window').textContent=` bars ${left}–${right-1} / ${bars.length}（金点：事件）`;
}
function choose(r){selected=r.bar_index;left=Math.max(0,Math.min(bars.length-80,selected-35));
 $('detail').textContent=JSON.stringify(r,null,2);const b=bars[selected];
 $('candle').textContent=`bar ${selected} · ${b.completed_at} · O ${b.open} H ${b.high} L ${b.low} C ${b.close}`;
 draw();}
function table(){const list=records.filter(r=>(!$('kind').value||r.kind===$('kind').value)&&
 (!$('status').value||r.status===$('status').value));$('rows').replaceChildren();
 $('count').textContent=` ${list.length} / ${records.length} 条时间事实`;
 for(const r of list){const tr=document.createElement('tr');
 const texts=[`${r.effective_at} / ${r.bar_index}`,`${r.kind} / ${r.direction}`,r.status,
 r.source?`${r.source.source_type} [${r.source.lower}, ${r.source.upper}]`:'无事件锚',
 [...r.reasons,...r.trigger_reasons,...r.related_keys.map(k=>'关联 '+k.slice(0,12))].join(' · ')];
 for(const text of texts){const td=document.createElement('td');td.textContent=text;tr.append(td);}
 tr.onclick=()=>choose(r);$('rows').append(tr);}}
$('kind').onchange=$('status').onchange=table;
$('prev').onclick=()=>{left=Math.max(0,left-50);draw();};
$('next').onclick=()=>{left=Math.min(Math.max(0,bars.length-80),left+50);draw();};
window.addEventListener('resize',draw);table();draw();
</script></html>
