[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-infra-quant"
version = "0.1.0"
description = "Local-first AI infrastructure portfolio foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "openai==3.8.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "tzdata==2025.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
futu = [
  "futu-api==10.10.7008",
]
dev = [
  "playwright==1.55.0",
  "mypy==1.17.1",
  "psycopg[binary]==3.2.9",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[project.scripts]
ai-infra-futu-poc = "ai_infra_quant.integrations.futu_quote.poc:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_infra_quant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["src/ai_infra_quant/database/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
